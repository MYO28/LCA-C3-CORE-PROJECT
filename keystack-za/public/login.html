<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Keystack ZA</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">KEY<span>STACK</span> <small>ZA</small></a
        ><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
        <nav id="nav-links" class="nav-links"></nav>
      </div>
    </header>
    <main class="page">
      <div class="container auth-wrap">
        <div class="auth-card reveal">
          <div class="eyebrow">Welcome back</div>
          <h1>Log in</h1>
          <p class="muted">Access your basket and previous orders.</p>
          <div id="message"></div>
          <form id="login-form" class="form">
            <div class="form-group"><label>Email</label><input class="field" name="email" type="email" required /></div>
            <div class="form-group"><label>Password</label><input class="field" name="password" type="password" required /></div>
            <button class="btn accent">Login</button>
          </form>
          <p>New here? <a href="/register.html">Create an account</a></p>
        </div>
      </div>
    </main>
    <script src="/js/app.js"></script>
  </body>
</html>
