<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register | Keystack ZA</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">KEY<span>STACK</span> <small>ZA</small></a
        ><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
        <nav id="nav-links" class="nav-links"></nav>
      </div>
    </header>
    <main class="page">
      <div class="container auth-wrap">
        <div class="auth-card reveal">
          <div class="eyebrow">Start building</div>
          <h1>Create your account</h1>
          <p class="muted">Save your basket and keep track of your orders.</p>
          <div id="message"></div>
          <form id="register-form" class="form">
            <div class="form-group"><label>Name</label><input class="field" name="name" required /></div>
            <div class="form-group"><label>Email</label><input class="field" name="email" type="email" required /></div>
            <div class="form-group">
              <label>Password</label><input class="field" name="password" type="password" minlength="6" required />
            </div>
            <button class="btn accent">Create account</button>
          </form>
          <p>Already have an account? <a href="/login.html">Log in</a></p>
        </div>
      </div>
    </main>
    <script src="/js/app.js"></script>
  </body>
</html>
